name: Build block-editor-image-filename-prompt

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package plugin
        run: |
          rm -rf /tmp/block-editor-image-filename-prompt
          mkdir -p /tmp/block-editor-image-filename-prompt
          rsync -a . /tmp/block-editor-image-filename-prompt/ \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.github \
            --exclude=.gitignore \
            --exclude=package-lock.json \
            --exclude=package.json
          cd /tmp/block-editor-image-filename-prompt
          zip -r /tmp/block-editor-image-filename-prompt.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: block-editor-image-filename-prompt
          path: /tmp/block-editor-image-filename-prompt.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/block-editor-image-filename-prompt.zip

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: false
          dry-run: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          BUILD_DIR: /tmp/block-editor-image-filename-prompt